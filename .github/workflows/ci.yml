name: Skill validation
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run validate:example
      - run: npm run validate:forecast
      - run: npm run build:example
      - run: npm run build:forecast:resources
      - run: npm run build:forecast:integrated
      - run: npm run validate:operations
      - run: npm run build:operations
      - run: npm run build:operations:resources
      - run: npm run validate:school
      - run: npm run build:school
